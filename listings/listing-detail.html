<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Get the full details on this auction. See the current highest bid, seller information, and item tags. Join the bidding war."
    />
    <title>Student Auction House | Listing</title>
    <script
      src="https://kit.fontawesome.com/bfed71705b.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/scripts/pages/handleDetailPage.mjs" type="module"></script>
  </head>

  <body class="grid min-h-screen grid-rows-[auto_1fr_auto] bg-bg">
    <header class="bg-white shadow-lg sticky top-0 z-50">
      <nav
        class="container mx-auto px-4 py-2 flex items-center justify-between"
      >
        <a href="/index.html" class="shrink-0">
          <img
            src="/assets/studentauctionhouselogo.png"
            alt="Student Auction House logo"
            class="h-8 md:h-10 w-auto"
          />
        </a>

        <div
          id="user-status-bar"
          class="hidden flex-col items-start gap-1 sm:flex-row sm:items-center"
        >
          <p
            id="welcome-text"
            class="text-xs md:hidden lg:block lg:text-base font-medium italic text-primary"
          ></p>

          <div class="flex items-center gap-1 md:gap-2">
            <img
              src="/assets/sp2-coin.png"
              class="w-4 h-4 md:w-5 md:h-5 lg:w-6 lg:h-6"
              alt="credits"
            />
            <span
              id="user-credits"
              class="text-xs md:text-sm lg:text-base font-bold text-primary"
            >
              0
            </span>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <div class="hidden md:flex space-x-6 items-center">
            <a
              href="/index.html"
              class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
              >Home</a
            >
            <a
              href="/about/index.html"
              class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
              >About</a
            >

            <div id="logged-in-nav" class="hidden items-center space-x-6">
              <a
                href="/listings/index.html"
                class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
                >Listings</a
              >
              <a
                href="/profile/index.html"
                class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
                >Profile</a
              >
              <button
                id="logout-button"
                class="bg-primary text-white px-6 py-1.5 rounded-lg text-sm font-semibold transition-colors duration-200 hover:bg-red-700 hover:text-white active:bg-red-800 focus:ring-2 focus:ring-red-700"
              >
                Log Out
              </button>
            </div>

            <div id="logged-out-nav" class="flex items-center">
              <a
                href="/account/login.html"
                class="bg-primary text-white px-6 py-1.5 rounded-lg text-sm font-semibold"
                >Sign In</a
              >
            </div>
          </div>

          <button id="menu-btn" class="p-2 md:hidden block">
            <i class="fa-solid fa-bars text-2xl text-primary"></i>
          </button>
        </div>
      </nav>

      <div
        id="mobile-menu"
        class="hidden md:hidden absolute top-full left-0 w-full bg-off-white shadow-lg py-8 z-50"
      >
        <div class="flex flex-col items-center font-sans gap-6">
          <a
            href="/index.html"
            class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >Home</a
          >
          <a
            href="/about/index.html"
            class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >About</a
          >

          <div
            id="mobile-logged-in-nav"
            class="hidden flex-col items-center gap-6 w-full"
          >
            <a
              href="/listings/index.html"
              class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
              >Listings</a
            >
            <a
              href="/profile/index.html"
              class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
              >Profile</a
            >
            <button
              id="mobile-logout-button"
              class="bg-primary text-white px-8 py-2 rounded-lg transition hover:bg-red-700 hover:text-white focus:ring-2 focus:ring-red-700 focus:outline-none active:bg-red-800 disabled:opacity-50"
            >
              Log Out
            </button>
          </div>

          <div
            id="mobile-logged-out-nav"
            class="flex flex-col items-center gap-6 w-full"
          >
            <a
              href="/account/login.html"
              class="text-md bg-primary text-white px-8 py-2 rounded-lg"
              >Sign In</a
            >
          </div>
        </div>
      </div>
    </header>
    <main class="bg-off-white mt-6 md:mt-10">
      <div class="container mx-auto px-4 max-w-7xl">
        <!-- Card template single listing -->
        <template id="listing-template">
          <div
            href="/listings/listing-detail.html"
            class="js-link group relative my-4 overflow-hidden rounded-2xl bg-white shadow-lg flex flex-col h-full"
          >
            <article
              class="group relative overflow-hidden rounded-2xl border-2 border-border bg-white shadow-lg grid lg:grid-cols-2 gap-6 p-4"
            >
              <div>
                <h1
                  class="js-title my-2 font-sans text-lg md:text-2xl text-center font-bold text-text"
                >
                  Listing Title
                </h1>
              </div>

              <div
                class="relative h-60 w-full lg:h-full overflow-hidden lg:row-span-2"
              >
                <div class="js-image h-full w-full bg-cover bg-center"></div>
              </div>
              <div class="p-4 flex flex-col">
                <div class="flex flex-col gap-0.5 mt-2">
                  <div class="flex items-center gap-2 mb-2">
                    <span
                      class="js-status-badge px-2 py-1 text-xs rounded-lg"
                    ></span>
                  </div>
                  <div class="flex- items-center gap-1.5">
                    <span class="text-sm font-medium text-text">By:</span>
                    <span class="js-author text-sm font-medium text-detail"
                      >Author Name</span
                    >
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span class="text-sm font-medium text-text">Created:</span>
                    <span class="js-date text-sm font-medium text-detail"
                      >Feb 5, 2026</span
                    >
                  </div>

                  <div class="flex items-center gap-1.5 text-sm text-text/80">
                    <span class="text-sm font-medium text-text">Ends:</span>
                    <span class="js-end-date"></span>
                    <span class="js-end-time text-detail/80"></span>
                  </div>
                </div>

                <p class="js-description my-2 font-sans text-sm text-text grow">
                  Description of listing item goes here.
                </p>

                <div class="js-tag-container flex flex-wrap gap-2 my-2"></div>

                <div class="flex- items-center gap-1.5">
                  <span class="text-sm font-medium text-text">Total Bids:</span>
                  <span class="js-bid-count text-sm font-medium text-detail"
                    >0 bids</span
                  >
                </div>
                <div
                  class="flex items-center bg-border/20 px-2 py-1 rounded-lg gap-2 mt-3"
                >
                  <span class="text-sm font-medium text-text"
                    >Highest Bid:</span
                  >
                  <span class="js-highest-bid text-md text-accent font-bold"
                    >No bids yet</span
                  >
                </div>
                <div class="flex flex-col gap-2 mt-3">
                  <span class="text-sm font-medium text-text">Bid History</span>
                  <span
                    class="js-bid-history-container text-md text-text font-bold"
                    >No bids yet</span
                  >
                </div>
                <div id="bid-section" class="mt-4">
                  <form id="bid-form" class="flex gap-2">
                    <input
                      type="number"
                      id="bid-amount"
                      placeholder="Enter your bid"
                      class="border rounded px-2 py-1 w-full required"
                    />
                    <button
                      type="submit"
                      class="bg-primary text-white px-4 py-1 rounded transition hover:bg-detail hover:text-text focus:ring-2 focus:ring-detail focus:outline-detail active:bg-detail disabled:opacity-50"
                    >
                      Place Bid
                    </button>
                    <p id="bid-message" class="text-sm mt-2 text-detail"></p>
                  </form>
                </div>
              </div>
            </article>
          </div>
        </template>

        <div id="listings-container" class=""></div>
      </div>
    </main>
    <footer class="bg-white p-4 shadow-inner">
      <div class="container mx-auto space-y-4 text-center">
        <a href="/index.html">
          <img
            src="/assets/studentauctionhouselogo.png"
            alt="Student Auction House logo"
            class="m-auto h-auto w-28 pb-4 hover:opacity-80 transition-opacity"
          />
        </a>

        <div
          class="flex justify-center font-medium font-sans text-xs sm:text-sm space-x-6"
        >
          <a
            href="/contact/index.html"
            class="hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >Contact</a
          >
          <a
            href="/about/index.html"
            class="hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >About</a
          >
          <a
            href="/terms/index.html"
            class="hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >Terms</a
          >
          <a
            href="/privacy/index.html"
            class="hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >Privacy</a
          >
        </div>
        <div class="flex justify-center space-x-5 text-xl text-primary">
          <a href="https://www.facebook.com" aria-label="Link to Facebook">
            <i
              class="fa-brands fa-square-facebook hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
          <a href="https://www.instagram.com" aria-label="Link to Instagram">
            <i
              class="fa-brands fa-square-instagram hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
          <a href="https://www.youtube.com" aria-label="Link to YouTube">
            <i
              class="fa-brands fa-square-youtube hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
          <a href="https://www.tiktok.com" aria-label="Link to TikTok">
            <i
              class="fa-brands fa-tiktok hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
          <a href="https://x.com" aria-label="Link to x (formerly Twitter)">
            <i
              class="fa-brands fa-square-x-twitter hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
        </div>
        <p class="text-sm text-primary">
          Copyright &copy; StudentAuctionHouseLtd 2026
        </p>
      </div>
    </footer>
  </body>
</html>
